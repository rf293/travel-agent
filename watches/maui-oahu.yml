name: maui-oahu
description: Two travelers meet on Maui or Oahu — LetsFG only, priced from scratch

party:
  meet_airports: [OGG, HNL]
  travelers:
    - id: yvr
      label: Vancouver
      origin: YVR
      currency: CAD
      time_windows:
        outbound:
          field: departure
          earliest: "14:00"
        return:
          field: arrival
          latest_at: "2026-10-13T01:00"
    - id: cpr
      label: Casper
      origin: CPR
      currency: USD
      time_windows:
        outbound:
          field: departure
          earliest: "14:00"
        return:
          field: arrival
          latest_at: "2026-10-13T10:00"

trip_shape: round_trip
ticketing: separate_per_traveler

dates:
  outbound: "2026-10-08"
  return: "2026-10-12"

cabin: economy
bags: carry-on only
pax_per_traveler: 1
near_match_minutes: 30
near_match_savings_threshold: 25

fx:
  cad_per_usd: 1.39  # stated at quote time; override with --fx

letsfg:
  max_searches_per_window: 10
  window_seconds: 600
